name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v2.0.0
